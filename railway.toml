# Railway config-as-code.
# Railpack is Railway's current default builder; it auto-detects `npm run build`
# and `npm start` from package.json. Values are stated explicitly so a future
# deploy can't drift.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3